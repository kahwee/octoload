name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: ["24.22.1", "26.12.1"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test release metadata guard
        run: node --test scripts/check-release-guard.mjs

      - name: Reject npm lockfiles
        run: test ! -e package-lock.json

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Type checking emits dist, so the build and package checks wait for this group.
      - parallel:
          - name: Type check
            run: pnpm run typecheck

          - name: Lint
            run: pnpm run lint

          - name: Check formatting
            run: pnpm run format:check

          - name: Check README examples
            run: pnpm run test:docs

          - name: Run tests with coverage
            run: pnpm exec vitest run --coverage
      - name: Build
        run: pnpm run build

      - name: Smoke test built package and CLI
        run: pnpm run test:package

      - name: Check storage harness behavior
        run: pnpm run test:harness

      - name: Check real PostgreSQL engine with PGlite
        run: pnpm run test:db:pglite

      - name: Run disposable database examples
        run: |
          node examples/database.mjs sqlite
          node examples/database.mjs pglite
          node examples/persistent-database.mjs sqlite
          node examples/persistent-database.mjs pglite

      - name: Install browser for E2E
        if: matrix.node-version == '24.22.1'
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser lifecycle and failure recovery (local storage fixture)
        if: matrix.node-version == '24.22.1'
        run: pnpm run test:e2e

      - name: Upload coverage reports to Codecov
        if: matrix.node-version == '24.22.1'
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: kahwee/octoload
