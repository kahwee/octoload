name: Publish npm package
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: npm-release-octoload
  queue: max
  cancel-in-progress: false
jobs:
  build:
    if: true
    outputs:
      should_publish: ${{ steps.metadata.outputs.should_publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --test scripts/check-release-guard.mjs
          node scripts/release-check.mjs "$RELEASE_TAG"
      - name: Require successful CI on this exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          git merge-base --is-ancestor "$source_sha" "origin/main"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$source_sha&per_page=100" > "$RUNNER_TEMP/ci.json"
          jq -e --arg sha "$source_sha" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success" and .event == "push" and .head_branch == "main")] | length > 0' "$RUNNER_TEMP/ci.json"
      - run: pnpm install --frozen-lockfile
      - name: Check and build
        run: pnpm run typecheck && pnpm run lint && pnpm run format:check && pnpm run test:docs && pnpm run coverage && pnpm run build && pnpm run test:package && pnpm run test:harness && pnpm run test:db:pglite
      - name: Pack the checked output
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          pnpm pack --out "$RUNNER_TEMP/release/package.tgz"
          node scripts/release-check.mjs "$RELEASE_TAG"
          tar -tzf "$RUNNER_TEMP"/release/*.tgz
          tar -xOf "$RUNNER_TEMP"/release/*.tgz package/package.json > "$RUNNER_TEMP/packed-package.json"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const source = JSON.parse(readFileSync("package.json")); const packed = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/packed-package.json")); if (packed.name !== source.name || packed.version !== source.version || packed.private) throw new Error("Packed package identity differs from checked source")'
      - name: Check registry and archive identity
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release-check.mjs "$RELEASE_TAG" --archive-registry "$RUNNER_TEMP/release/package.tgz"
      - name: Record checked archive digest
        working-directory: ${{ runner.temp }}/release
        run: sha256sum package.tgz > package.tgz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: npm-package
          path: ${{ runner.temp }}/release/
          retention-days: 7
  publish:
    needs: build
    if: needs.build.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.12.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: npm-package
          path: ${{ runner.temp }}/release
      - name: Verify checked archive digest
        working-directory: ${{ runner.temp }}/release
        run: sha256sum -c package.tgz.sha256
      - name: Publish checked tarball with npm OIDC
        working-directory: ${{ runner.temp }}
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          dist_tag=latest
          if [ "$PRERELEASE" = true ]; then dist_tag=next; fi
          npm publish "$RUNNER_TEMP/release/package.tgz" --ignore-scripts --access public --tag "$dist_tag" --registry https://registry.npmjs.org
  verify:
    needs: [build, publish]
    if: always() && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.12.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: npm-package
          path: ${{ runner.temp }}/release
      - name: Verify published archive and dist-tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          dist_tag=latest
          if [ "$PRERELEASE" = true ]; then dist_tag=next; fi
          node scripts/release-check.mjs "$RELEASE_TAG" --verify-archive "$RUNNER_TEMP/release/package.tgz" "$dist_tag"
